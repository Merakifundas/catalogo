<style>
/* Layout: vidriera de tienda — buscador de "tu celular" arriba, grilla de fundas sobre fondo blanco de estudio, ficha en hoja inferior y bolsa de pedido flotante. */
:root{
  --bg:#FCF5F8; --surface:#FFFFFF; --ink:#2A1420; --muted:#7B5C6C; --line:#EFD9E4; --soft:#F8E6EF;
  --accent:#D12E7E; --accent-ink:#FFFFFF; --accent-soft:#FBE0EC; --studio:#FFFFFF; --good:#1E8A5A;
  --f-display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(80,20,50,.06), 0 8px 24px rgba(80,20,50,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#160C12; --surface:#211520; --ink:#F9E9F1; --muted:#C6A2B4; --line:#3A2633; --soft:#2B1B26;
  --accent:#FF7DB8; --accent-ink:#3A0820; --accent-soft:#3C1A2C; --studio:#FFFFFF; --good:#5FD39A; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#160C12; --surface:#211520; --ink:#F9E9F1; --muted:#C6A2B4; --line:#3A2633; --soft:#2B1B26;
  --accent:#FF7DB8; --accent-ink:#3A0820; --accent-soft:#3C1A2C; --studio:#FFFFFF; --good:#5FD39A; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1;color:var(--accent)}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.upd{font-size:12px;color:var(--muted);text-align:right}
.finder{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px}
.finder label{position:relative;display:block}
.finder .lbl{position:absolute;left:12px;top:6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.finder select,.finder input{width:100%;appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:21px 12px 7px;font:inherit;font-weight:600;min-height:50px}
.finder select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 24px,calc(100% - 12px) 24px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.finder select.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{padding-block:16px 120px}
.promos{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:18px}
.promos::-webkit-scrollbar{display:none}
.promo{flex:none;min-width:170px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.promo.alt{background:var(--accent-soft);color:var(--ink)}
.promo .k{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.85}
.promo .v{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.15;letter-spacing:-.01em}
.promo .s{font-size:12.5px;opacity:.9}
.count{font-size:13px;color:var(--muted);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media (min-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{appearance:none;text-align:left;border:0;background:var(--surface);border-radius:var(--r);padding:0;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);min-width:0}
.card .ph{position:relative;aspect-ratio:4/5;background:var(--studio);display:grid;place-items:center;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:contain;transition:transform .35s ease}
@media (hover:hover){.card:hover .ph img{transform:scale(1.04)}}
.noimg{color:#B8A0AC;font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.03em;text-align:center;padding:12px;line-height:1}
.tag{position:absolute;left:8px;top:8px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px}
.card .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card .nm{font-weight:700;font-size:14.5px;line-height:1.25;overflow-wrap:anywhere}
.card .pr{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.card .pr small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.card .mt{font-size:12.5px;color:var(--muted)}
.dots{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.dot{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:inline-block;flex:none}
.dots .more{font-size:11.5px;color:var(--muted);margin-left:2px}
.empty{background:var(--surface);border-radius:var(--r);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h2{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:42ch}

/* hoja de producto */
.sheetbg{position:fixed;inset:0;background:rgba(30,10,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:880px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.sheetbg{align-items:center;padding:24px}.sheet{border-radius:22px;max-height:88vh}}
.sheet .in{display:grid;gap:18px;padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.sheet .in{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:22px}}
.sheet .big{background:var(--studio);border-radius:16px;aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden;max-height:58vh;width:100%}
.sheet .big img{width:100%;height:100%;object-fit:contain}
.sheet .info{display:flex;flex-direction:column;gap:14px;min-width:0}
.sheet .x{position:sticky;top:0;display:flex;justify-content:flex-end;padding:10px 12px 0;z-index:2;pointer-events:none}
.sheet .x button{pointer-events:auto;appearance:none;border:0;width:38px;height:38px;border-radius:50%;background:var(--soft);cursor:pointer;font-size:20px;line-height:1}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
.sheet .cat{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.priceblk{display:flex;flex-direction:column;gap:2px}
.priceblk .p{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.02em}
.priceblk .c{font-size:13.5px;color:var(--muted)}
.opt{display:flex;flex-direction:column;gap:8px}
.opt .lb{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.opt .lb b{color:var(--ink);letter-spacing:0;text-transform:none;font-size:14px;margin-left:4px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{appearance:none;border:2px solid transparent;background:none;padding:2px;border-radius:50%;cursor:pointer}
.sw button .dot{width:28px;height:28px}
.sw button[aria-pressed="true"]{border-color:var(--accent)}
.sw .txt{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.sw .txt[aria-pressed="true"]{border:2px solid var(--accent);padding:5px 11px}
.models{display:flex;gap:6px;flex-wrap:wrap}
.models button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;font-size:13.5px;font-weight:600;cursor:pointer}
.models button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.minipromo{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.minipromo b{color:var(--accent)}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:15.5px;cursor:pointer;text-align:center;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:8px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* bolsa */
.bagbtn{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 20px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:0 8px 28px rgba(40,10,25,.3);cursor:pointer;max-width:calc(100% - 32px)}
.bagbtn .n{background:var(--accent);color:#fff;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12.5px;padding:0 6px}
.sheet .in.bag{display:flex;flex-direction:column;gap:12px;padding-bottom:4px}
.sheet .in.bag h2{margin-top:-30px}
.bagline{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px}
.bagline .th{width:52px;height:64px;border-radius:9px;background:var(--studio);object-fit:contain}
.bagline .t{font-weight:700;font-size:14px}
.bagline .s{font-size:12.5px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{appearance:none;border:1px solid var(--line);background:var(--surface);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1}
.tot{display:flex;flex-direction:column;gap:4px;font-size:14px}
.tot .row{display:flex;justify-content:space-between;gap:12px}
.tot .row.grand{font-family:var(--f-display);font-weight:800;font-size:22px}
.tot .row.disc{color:var(--good);font-weight:600}
.note{font-size:12.5px;color:var(--muted)}
.contact{display:flex;flex-direction:column;gap:6px;background:var(--soft);border-radius:12px;padding:12px}
.contact .no{font-family:var(--f-display);font-weight:800;font-size:20px;user-select:all}
footer{color:var(--muted);font-size:12.5px;padding-block:8px 24px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="brandrow"><div class="brand" id="brand">Meraki<small>Fundas y accesorios</small></div><div class="upd" id="upd"></div></div>
  <div class="finder">
    <label><span class="lbl">Tu celular</span><select id="f-model" aria-label="Tu celular"><option value="">Todos los modelos</option></select></label>
    <label><span class="lbl">Buscar</span><input id="f-q" type="search" placeholder="Aqua, MagSafe, rosa…" autocomplete="off" aria-label="Buscar"></label>
  </div>
  <div class="cats" id="cats" role="group" aria-label="Categorías"></div>
</div></header>

<main class="wrap">
  <div class="promos" id="promos"></div>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"><div class="empty" style="grid-column:1/-1"><h2>Cargando el catálogo…</h2><p>Un segundo, estamos trayendo lo que hay en stock.</p></div></div>
</main>
<footer class="wrap" id="foot"></footer>

<div class="sheetbg" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title" id="sheetbox"></div></div>
<button class="bagbtn" id="bagbtn" hidden></button>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const COLORES = {negra:"#1b1b1b",negro:"#1b1b1b",blanca:"#f5f5f5",blanco:"#f5f5f5",roja:"#d62e2e",rojo:"#d62e2e",rosa:"#f2a7c3","rosa viejo":"#c98e98","rosa fluo":"#ff5fa8",azul:"#2f5bd3","azul marino":"#1d2b5e","azul cobalto":"#2347c9","azul oscuro":"#1f2f6b","azul cielo":"#9cc7ee",celeste:"#8cc8f0",turquesa:"#2bc2c2",verde:"#3aa55b","verde militar":"#4b5a32","verde oscuro":"#235c3a","verde agua":"#7fd6c1","verde fluo":"#7cff4f",violeta:"#8a52d6",purpura:"#7a2f9e",purple:"#7a2f9e",lila:"#c3a6ef",magenta:"#d6249f",fucsia:"#e4298c",gris:"#9a9a9a","gris oscuro":"#5a5a5a",marron:"#7a4b2a",naranja:"#f08a24","amarillo crema":"#f3e3a2",amarillo:"#f2d43a",plateada:"#c9ccd3",plateado:"#c9ccd3",silver:"#c9ccd3",dorada:"#d9b44a",dorado:"#d9b44a",bordo:"#7a1f2e",vino:"#6b1f2e",coral:"#ff7f6b",petroleo:"#1f5260",black:"#1b1b1b",pink:"#f2a7c3","light blue":"#9cc7ee",transparente:"linear-gradient(135deg,#fff 40%,#dfe6ee)"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const money = new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0});
const fm = n => money.format(Math.round(n||0));
const dotStyle = c => { const h = COLORES[norm(c)]; return h ? `background:${h}` : `background:conic-gradient(#f2a7c3,#8cc8f0,#f3e3a2,#f2a7c3)`; };
const CAT_PL = {"Funda":"Fundas","Vidrio templado":"Vidrios templados","Protector de cámara":"Protectores de cámara","Cargador":"Cargadores","Protector de cable":"Protectores de cable","Accesorio":"Accesorios"};
const ls = {get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }};

let D = null; const S = {model: ls.get("mk-model") || "", q:"", cat:"", bag: ls.get("mk-bag") || []};
const foto = id => id ? `fotos/${id}.jpg` : "";
const cuotas = p => D && D.cuotas3 ? Math.round(p / (1 - D.cuotas3) / 100) * 100 : 0;
const escalaDe = precio => (D.escalas||[]).find(e => e.precio === precio);
function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }

/* misma lógica de promos que la app: escalas por precio de lista (todas al precio por unidad del escalón alcanzado) y combos si conviene */
function promo(lines){
  const units = []; lines.forEach(l => { for (let k = 0; k < l.cant; k++) units.push({cat:l.cat, p:l.precio}); });
  const lista = units.reduce((a,u)=>a+u.p,0); if (!units.length) return {total:0, lista:0, labs:[]};
  const esc2 = (n, unit) => { const e = escalaDe(unit); if (!e || n < 2) return {t:n*unit, l:""};
    const t = e.packs.filter(p => p.cant <= n).sort((a,b)=>b.cant-a.cant)[0]; if (!t) return {t:n*unit, l:""};
    return {t:Math.round(n * t.precio / t.cant), l:`${t.cant} × ${fm(t.precio)}`}; };
  const resto = us => { const g = {}; let tot = 0; const labs = [];
    us.forEach(u => { if (u.cat === "Funda" && escalaDe(u.p)) g[u.p] = (g[u.p]||0) + 1; else tot += u.p; });
    Object.entries(g).forEach(([p,n]) => { const r = esc2(n, +p); tot += r.t; if (r.l) labs.push(`Promo ${r.l}`); }); return {tot, labs}; };
  const combos = D.combos || []; let best = null;
  const go = (ci, us, tot, labs) => {
    if (ci === combos.length){ const r = resto(us), t = tot + r.tot; if (!best || t < best.total) best = {total:t, labs:[...labs, ...r.labs]}; return; }
    const c = combos[ci]; let cur = us.slice(), k = 0, extra = 0; go(ci + 1, cur, tot, labs);
    while (k < 10){ let ok = true, pool = cur.slice();
      for (const cat of c.cats){ const cand = pool.filter(u => u.cat === cat).sort((a,b) => cat === "Funda" ? b.p - a.p : a.p - b.p)[0]; if (!cand){ ok = false; break; } pool.splice(pool.indexOf(cand), 1); }
      if (!ok) break; k++; cur = pool; extra += c.precio; go(ci + 1, cur, tot + extra, [...labs, `${k > 1 ? k + " × " : ""}Combo ${comboNombre(c)}`]); } };
  go(0, units, 0, []);
  if (!best || best.total >= lista - .5) return {total:lista, lista, labs:[]};
  return {total:best.total, lista, labs:best.labs};
}
const comboNombre = c => c.cats.map((k,i) => !i ? "funda" : k === "Vidrio templado" ? "vidrio" : k === "Protector de cámara" ? "protector de cámara" : k.toLowerCase()).join(" + ");

/* ---------- vistas ---------- */
function filtered(){
  const toks = norm(S.q).split(" ").filter(Boolean);
  return D.productos.map(p => { let items = p.items;
      if (S.model) items = items.filter(i => i.modelo === S.model);
      if (toks.length) items = items.filter(i => toks.every(t => norm(`${p.nombre} ${p.categoria} ${i.modelo} ${i.color}`).includes(t)));
      return items.length ? {...p, items} : null; })
    .filter(p => p && (!S.cat || p.categoria === S.cat));
}
function render(){
  const list = filtered();
  $("#cats").innerHTML = [["","Todo"], ...[...new Set(D.productos.map(p => p.categoria))].sort((a,b) => (a!=="Funda") - (b!=="Funda") || a.localeCompare(b)).map(c => [c, CAT_PL[c] || c])]
    .map(([c,l]) => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${S.cat===c}">${esc(l)}</button>`).join("");
  $("#f-model").classList.toggle("on", !!S.model);
  const n = list.reduce((a,p)=>a+p.items.length,0);
  $("#count").textContent = list.length ? `${list.length} producto${list.length>1?"s":""}${S.model ? " para " + S.model : ""} · ${n} opci${n>1?"ones":"ón"} en stock` : "";
  $("#grid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty" style="grid-column:1/-1"><h2>No encontramos eso en stock</h2><p>${S.model ? `Para ${esc(S.model)} no hay nada con esa búsqueda. ` : ""}Probá con otra palabra o escribinos: muchas fundas las conseguimos por encargo.</p>${contactBtn("Hola! Busco una funda" + (S.model ? " para " + S.model : "") + (S.q ? ": " + S.q : ""))}</div>`;
  renderBag();
}
function card(p){
  const cols = [...new Set(p.items.map(i => i.color).filter(Boolean))], min = Math.min(...p.items.map(i => i.precio));
  const fc = cols.length === 1 && p.colores[cols[0]] ? p.colores[cols[0]] : p.foto || Object.values(p.colores).find(Boolean) || "";
  const mods = [...new Set(p.items.map(i => i.modelo))];
  const e = p.categoria === "Funda" && escalaDe(min), tag = e && e.packs.length ? `${e.packs[0].cant} × ${fm(e.packs[0].precio)}` : "";
  return `<button class="card" data-p="${esc(p.id)}"><div class="ph">${fc ? `<img src="${foto(fc)}" alt="${esc(p.nombre)}" loading="lazy">` : `<span class="noimg">${esc(p.nombre)}</span>`}${tag ? `<span class="tag">${tag}</span>` : ""}</div>
    <div class="bd"><span class="nm">${esc(p.nombre)}</span><span class="pr num">${p.items.some(i => i.precio !== min) ? "<small>desde </small>" : ""}${fm(min)}</span>
    ${cols.length ? `<span class="dots" aria-label="${cols.length} colores">${cols.slice(0,7).map(c => `<span class="dot" style="${dotStyle(c)}" title="${esc(c)}"></span>`).join("")}${cols.length > 7 ? `<span class="more">+${cols.length-7}</span>` : ""}</span>` : ""}
    <span class="mt">${S.model ? esc(S.model) : mods.length === 1 ? esc(mods[0]) : `${mods.length} modelos`}</span></div></button>`;
}
function renderPromos(){
  const h = [];
  (D.escalas||[]).forEach((e,i) => { if (!e.packs.length) return; h.push(`<div class="promo${i%2?" alt":""}"><span class="k">Fundas de ${fm(e.precio)}</span><span class="v num">${e.packs.map(p => `${p.cant} × ${fm(p.precio)}`).join(" · ")}</span><span class="s">Combinalas como quieras</span></div>`); });
  (D.combos||[]).forEach(c => h.push(`<div class="promo alt"><span class="k">Combo</span><span class="v num">${fm(c.precio)}</span><span class="s">${esc(comboNombre(c).replace(/^funda/,"Funda"))}</span></div>`));
  $("#promos").innerHTML = h.join(""); $("#promos").hidden = !h.length;
}

/* ---------- ficha ---------- */
let cur = null;
function openP(pid){
  const p = D.productos.find(x => x.id === pid); if (!p) return;
  const items = p.items, cols = [...new Set(items.map(i => i.color))];
  const pref = S.model && items.find(i => i.modelo === S.model);
  cur = {p, color: pref ? pref.color : cols[0], modelo: pref ? pref.modelo : ""};
  drawP(); $("#sheet").hidden = false; document.body.style.overflow = "hidden"; $("#sheetbox").scrollTop = 0;
}
function drawP(){
  const {p} = cur, cols = [...new Set(p.items.map(i => i.color))];
  const mods = p.items.filter(i => i.color === cur.color).map(i => i.modelo);
  if (cur.modelo && !mods.includes(cur.modelo)) cur.modelo = "";
  if (!cur.modelo && mods.length === 1) cur.modelo = mods[0];
  const sel = p.items.find(i => i.color === cur.color && i.modelo === cur.modelo);
  const precio = sel ? sel.precio : Math.min(...p.items.filter(i => i.color === cur.color).map(i => i.precio));
  const f = p.colores[cur.color] || p.foto;
  const e = p.categoria === "Funda" && escalaDe(precio), c3 = cuotas(precio);
  const combosP = (D.combos||[]).filter(c => c.cats.includes(p.categoria));
  $("#sheetbox").innerHTML = `<div class="x"><button type="button" data-close aria-label="Cerrar">×</button></div><div class="in">
    <div class="big">${f ? `<img src="${foto(f)}" alt="${esc(p.nombre + (cur.color ? " " + cur.color : ""))}">` : `<span class="noimg">${esc(p.nombre)}</span>`}</div>
    <div class="info">
      <div><div class="cat">${esc(p.categoria)}</div><h2 id="sh-title">${esc(p.nombre)}</h2></div>
      <div class="priceblk"><span class="p num">${!sel && mods.length > 1 && new Set(p.items.filter(i => i.color === cur.color).map(i=>i.precio)).size > 1 ? "desde " : ""}${fm(precio)}</span><span class="c">Efectivo o transferencia${c3 ? ` · 3 cuotas sin interés de ${fm(c3/3)} (${fm(c3)})` : ""}</span></div>
      ${cols.filter(Boolean).length ? `<div class="opt"><span class="lb">Color<b>${esc(cur.color)}</b></span><div class="sw">${cols.map(c => COLORES[norm(c)] ? `<button type="button" data-color="${esc(c)}" aria-pressed="${c===cur.color}" title="${esc(c)}" aria-label="${esc(c)}"><span class="dot" style="${dotStyle(c)}"></span></button>` : `<button type="button" class="txt" data-color="${esc(c)}" aria-pressed="${c===cur.color}">${esc(c)}</button>`).join("")}</div></div>` : ""}
      <div class="opt"><span class="lb">Modelo${cur.modelo ? `<b>${esc(cur.modelo)}</b>` : ""}</span><div class="models">${mods.map(m => `<button type="button" data-model="${esc(m)}" aria-pressed="${m===cur.modelo}">${esc(m)}</button>`).join("")}</div>
        ${S.model && !p.items.some(i => i.modelo === S.model) ? `<span class="note">No la tenemos para ${esc(S.model)}.</span>` : ""}</div>
      ${e && e.packs.length || combosP.length ? `<div class="minipromo">${e && e.packs.length ? `<span><b>Promo:</b> ${e.packs.map(x => `${x.cant} × ${fm(x.precio)}`).join(" · ")} combinando fundas de ${fm(e.precio)}</span>` : ""}${combosP.map(c => `<span><b>Combo:</b> ${esc(comboNombre(c))} ${fm(c.precio)}</span>`).join("")}</div>` : ""}
      <div class="acts"><button type="button" class="btn sec" id="add" ${sel ? "" : "disabled"}>Sumar al pedido</button>${contactBtn(sel ? `Hola! Quiero la ${p.nombre}${cur.color ? " " + cur.color : ""} para ${cur.modelo} (${fm(precio)})` : `Hola! Consulto por la ${p.nombre}`, sel ? "Pedir ahora" : "Consultar", "btn pri")}</div>
      ${sel ? "" : `<span class="note">Elegí el modelo de tu celular para sumarla al pedido.</span>`}
    </div></div>`;
}
function contactBtn(text, label, cls){
  label = label || "Escribinos"; cls = cls || "btn pri";
  if (D.whatsapp) return `<a class="${cls}" href="https://wa.me/${D.whatsapp}?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">${esc(label)} por WhatsApp</a>`;
  if (D.instagram) return `<a class="${cls}" href="https://instagram.com/${encodeURIComponent(D.instagram)}" target="_blank" rel="noopener">${esc(label)} por Instagram</a>`;
  return `<button type="button" class="${cls}" data-copy="${esc(text)}">Copiar mensaje</button>`;
}
function closeSheet(){ $("#sheet").hidden = true; document.body.style.overflow = ""; cur = null; }

/* ---------- pedido ---------- */
const bagLines = () => S.bag.map(b => { const p = D.productos.find(x => x.id === b.pid), it = p && p.items.find(i => i.modelo === b.modelo && i.color === b.color);
  return p && it ? {...b, p, precio: it.precio, cat: p.categoria} : null; }).filter(Boolean);
function renderBag(){
  const L = bagLines(); if (L.length !== S.bag.length){ S.bag = L.map(({pid,modelo,color,cant}) => ({pid,modelo,color,cant})); ls.set("mk-bag", S.bag); }
  const n = L.reduce((a,l)=>a+l.cant,0), pr = promo(L);
  const b = $("#bagbtn"); b.hidden = !n; b.innerHTML = `<span class="n">${n}</span>Mi pedido · <span class="num">${fm(pr.total)}</span>`;
}
function openBag(){
  const L = bagLines(), pr = promo(L);
  const msg = `Hola! Quiero hacer este pedido:\n${L.map(l => `• ${l.cant > 1 ? l.cant + " × " : ""}${l.p.nombre}${l.color ? " " + l.color : ""} — ${l.modelo}`).join("\n")}\nTotal: ${fm(pr.total)}${pr.labs.length ? " (" + pr.labs.join(", ") + ")" : ""}`;
  $("#sheetbox").innerHTML = `<div class="x"><button type="button" data-close aria-label="Cerrar">×</button></div><div class="in bag" style="grid-template-columns:1fr">
    <h2 id="sh-title">Mi pedido</h2>
    ${L.length ? L.map((l,i) => { const f = l.p.colores[l.color] || l.p.foto; return `<div class="bagline">${f ? `<img class="th" src="${foto(f)}" alt="">` : `<span class="th"></span>`}<div><div class="t">${esc(l.p.nombre)}</div><div class="s">${esc([l.color, l.modelo].filter(Boolean).join(" · "))} · ${fm(l.precio)}</div></div>
      <div class="qty"><button type="button" data-q="${i}" data-d="-1" aria-label="Uno menos">−</button><b class="num">${l.cant}</b><button type="button" data-q="${i}" data-d="1" aria-label="Uno más">+</button></div></div>`; }).join("") : `<p class="note">Tu pedido está vacío.</p>`}
    ${L.length ? `<div class="tot"><div class="row"><span>Precio de lista</span><span class="num">${fm(pr.lista)}</span></div>
      ${pr.total < pr.lista ? `<div class="row disc"><span>${esc(pr.labs.join(" · "))}</span><span class="num">−${fm(pr.lista - pr.total)}</span></div>` : ""}
      <div class="row grand"><span>Total</span><span class="num">${fm(pr.total)}</span></div>
      ${cuotas(pr.total) ? `<span class="note">o 3 cuotas sin interés de ${fm(cuotas(pr.total)/3)} con link de pago. Envío aparte.</span>` : `<span class="note">Envío aparte.</span>`}</div>
      ${contactBtn(msg, "Enviar pedido", "btn pri")}
      ${!D.whatsapp && !D.instagram ? `<span class="note">Copiá el mensaje y mandáselo a Meraki.</span>` : ""}
      <span class="note">El stock se confirma al responderte.</span>` : ""}
  </div>`;
  $("#sheet").hidden = false; document.body.style.overflow = "hidden"; $("#sheetbox").scrollTop = 0;
}

/* ---------- eventos ---------- */
document.addEventListener("click", async e => {
  const t = e.target;
  const c = t.closest(".card"); if (c){ openP(c.dataset.p); return; }
  const ch = t.closest("[data-cat]"); if (ch){ S.cat = ch.dataset.cat; render(); return; }
  if (t.closest("[data-close]") || t.id === "sheet"){ closeSheet(); return; }
  const co = t.closest("[data-color]"); if (co && cur){ cur.color = co.dataset.color; drawP(); return; }
  const mo = t.closest("[data-model]"); if (mo && cur){ cur.modelo = mo.dataset.model; drawP(); return; }
  if (t.closest("#add") && cur){ const k = S.bag.find(b => b.pid === cur.p.id && b.modelo === cur.modelo && b.color === cur.color);
    if (k) k.cant++; else S.bag.push({pid:cur.p.id, modelo:cur.modelo, color:cur.color, cant:1}); ls.set("mk-bag", S.bag); renderBag(); closeSheet(); toast("Sumado a tu pedido"); return; }
  if (t.closest("#bagbtn")){ openBag(); return; }
  const q = t.closest("[data-q]"); if (q){ const i = +q.dataset.q, L = bagLines(); const l = L[i]; if (!l) return;
    const k = S.bag.find(b => b.pid === l.pid && b.modelo === l.modelo && b.color === l.color); k.cant += +q.dataset.d; if (k.cant <= 0) S.bag.splice(S.bag.indexOf(k), 1);
    ls.set("mk-bag", S.bag); renderBag(); if (S.bag.length) openBag(); else closeSheet(); return; }
  const cp = t.closest("[data-copy]"); if (cp){ try{ await navigator.clipboard.writeText(cp.dataset.copy); toast("Mensaje copiado"); }catch(err){ toast("No se pudo copiar"); } }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
$("#f-model").addEventListener("change", e => { S.model = e.target.value; ls.set("mk-model", S.model); render(); });
$("#f-q").addEventListener("input", e => { S.q = e.target.value; render(); });

/* ---------- carga ---------- */
(async () => {
  try{ const r = await fetch("catalogo.json", {cache:"no-store"}); if (!r.ok) throw new Error(r.status); D = await r.json(); }
  catch(err){ $("#grid").innerHTML = `<div class="empty" style="grid-column:1/-1"><h2>No pudimos cargar el catálogo</h2><p>Revisá tu conexión y volvé a abrir la página.</p></div>`; return; }
  $("#brand").firstChild.textContent = D.negocio || "Meraki";
  const up = new Date(D.actualizado); $("#upd").innerHTML = `Stock actualizado<br>${up.toLocaleDateString("es-AR",{day:"numeric",month:"short"})} ${up.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",hour12:false})} hs`;
  const models = [...new Set(D.productos.flatMap(p => p.items.map(i => i.modelo)).filter(Boolean))].sort((a,b) => a.localeCompare(b, "es", {numeric:true}));
  if (S.model && !models.includes(S.model)) S.model = "";
  $("#f-model").innerHTML = `<option value="">Todos los modelos</option>` + models.map(m => `<option ${m===S.model?"selected":""}>${esc(m)}</option>`).join("");
  $("#foot").innerHTML = `Precios en efectivo o transferencia. Stock sujeto a confirmación.${D.instagram ? ` · <a href="https://instagram.com/${encodeURIComponent(D.instagram)}" target="_blank" rel="noopener" style="color:inherit">@${esc(D.instagram)}</a>` : ""}${D.whatsapp ? ` · WhatsApp <span style="user-select:all">+${esc(D.whatsapp)}</span>` : ""}`;
  renderPromos(); render();
})();
</script>
</body></html>
